<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados en Vivo - Conteo Rápido</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        #marcoResultados {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- PEGA AQUÍ TU ENLACE ADAPTADO CON htmlview -->
    <iframe id="marcoResultados" src="https://docs.google.com/spreadsheets/d/16GyKH6Ae6bkp7xexO0ZCtPcJK7I3bBkRcd0mHK3fNkw/htmlview?gid=674966579#gid=674966579"></iframe>

    <script>
        // Define cada cuántos segundos se recarga el marco (Ejemplo: 20000 = 20 segundos)
        const tiempoRecarga = 5000; 

        setInterval(function() {
            var iframe = document.getElementById('marcoResultados');
            iframe.src = iframe.src; // Fuerza al navegador a refrescar la vista
        }, tiempoRecarga);
    </script>

</body>
</html>
