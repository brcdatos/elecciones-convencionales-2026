<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados en Vivo - Conteo Rápido</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        #marcoResultados {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="contenedor" style="width: 100%; height: 100%;"></div>

    <script>
        // 1. Pega aquí el ID de tu planilla (lo que está entre /d/ y /edit en tu enlace de Google Sheets)
        const idPlanilla = "16GyKH6Ae6bkp7xexO0ZCtPcJK7I3bBkRcd0mHK3fNkw";
        
        // 2. Pega aquí el número de GID de tu pestaña TOTAL (lo que aparece después de #gid=)
        const gidHoja = "674966579"; 
        
        // Intervalo en milisegundos (20000 = 20 segundos)
        const tiempoRecarga = 5000; 

        function actualizarIframe() {
            var contenedor = document.getElementById('contenedor');
            
            // Creamos una URL dinámica agregando un parámetro de tiempo (?t=...) al final
            var urlDinamica = "https://docs.google.com/spreadsheets/d/" + idPlanilla + "/htmlview?t=" + new Date().getTime() + "#gid=" + gidHoja;
            
            // Inyectamos el iframe con la nueva URL forzando la descarga fresca
            contenedor.innerHTML = '<iframe id="marcoResultados" src="' + urlDinamica + '"></iframe>';
        }

        // Ejecutar inmediatamente al cargar la página
        actualizarIframe();

        // Repetir el proceso cada 20 segundos
        setInterval(actualizarIframe, tiempoRecarga);
    </script>

</body>
</html>
