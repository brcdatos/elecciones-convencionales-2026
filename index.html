<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados en Vivo - Conteo de Votos</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
        }
        
        #contenedor {
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            /* El iframe empieza invisible para ocultar el proceso de acomodado */
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        /* Cuando carga bien, aparece suavemente ya ordenado */
        iframe.listo {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="contenedor"></div>

    <script>
        const urlPublicada = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSrmKGhHQsoX9O9B71Pq3z87vmKWtOhHPTPlSF_IzZ_vpKOwRi-xFRQrzrj6cXmOy1fD90FUVkRE7m3/pubhtml?gid=674966579&single=true';
        const tiempoRecarga = 20000;

        function recargarVista() {
            const contenedor = document.getElementById('contenedor');
            const timestamp = new Date().getTime();
            const conector = urlPublicada.includes('?') ? '&' : '?';
            const urlConCacheBuster = urlPublicada + conector + 'nocache=' + timestamp;

            // Creamos el nuevo iframe de manera oculta
            const nuevoIframe = document.createElement('iframe');
            nuevoIframe.src = urlConCacheBuster;

            // Esperamos a que Google termine de renderizar todo internamente
            nuevoIframe.onload = function() {
                // Reemplazamos el viejo por el nuevo ya listo
                contenedor.innerHTML = '';
                contenedor.appendChild(nuevoIframe);
                
                // Un micro-respiro de seguridad y lo hacemos visible suavemente
                setTimeout(function() {
                    nuevoIframe.classList.add('listo');
                }, 150);
            };
        }

        recargarVista();
        setInterval(recargarVista, tiempoRecarga);
    </script>

</body>
</html>
