<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados en Vivo - Conteo Rápido</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        #marcoResultados {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Contenedor que mantendrá el iframe -->
    <div id="contenedor" style="width: 100%; height: 100%;">
        <iframe id="marcoResultados" src="https://docs.google.com/spreadsheets/d/16GyKH6Ae6bkp7xexO0ZCtPcJK7I3bBkRcd0mHK3fNkw/htmlview?gid=674966579#gid=674966579"></iframe>
    </div>

    <script>
        // Guarda tu enlace completo con /htmlview y el #gid aquí
        const urlPlanilla = "https://docs.google.com/spreadsheets/d/16GyKH6Ae6bkp7xexO0ZCtPcJK7I3bBkRcd0mHK3fNkw/htmlview?gid=674966579#gid=674966579";
        
        // Intervalo en milisegundos (20000 = 20 segundos)
        const tiempoRecarga = 5000; 

        setInterval(function() {
            var contenedor = document.getElementById('contenedor');
            // Recrea el iframe desde cero para forzar una consulta fresca a los servidores de Google
            contenedor.innerHTML = '<iframe id="marcoResultados" src="' + urlPlanilla + '"></iframe>';
        }, tiempoRecarga);
    </script>

</body>
</html>
