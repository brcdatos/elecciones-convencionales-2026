<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados en Vivo - Conteo de Votos</title>
    <style>
        /* Ocupa el 100% de la pantalla sin márgenes ni barras de desplazamiento */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: #ffffff;
        }
        
        #contenedor {
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Contenedor donde se montará la vista en vivo -->
    <div id="contenedor"></div>

    <script>
       const urlPublicada = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSrmKGhHQsoX9O9B71Pq3z87vmKWtOhHPTPlSF_IzZ_vpKOwRi-xFRQrzrj6cXmOy1fD90FUVkRE7m3/pubhtml?gid=674966579&single=true';

        // Intervalo de recarga en milisegundos (20000 = 20 segundos)
        const tiempoRecarga = 20000;

        function recargarVista() {
            const contenedor = document.getElementById('contenedor');
            
            // Genera un sello de tiempo único para romper la caché local del navegador
            const timestamp = new Date().getTime();
            
            // Si la URL ya tiene signos '?', usamos '&', de lo contrario '?'
            const conector = urlPublicada.includes('?') ? '&' : '?';
            const urlConCacheBuster = urlPublicada + conector + 'nocache=' + timestamp;

            // Destruye y vuelve a inyectar el iframe con la nueva dirección
            contenedor.innerHTML = '<iframe src="' + urlConCacheBuster + '"></iframe>';
        }

        // Ejecuta la primera carga apenas abre la página
        recargarVista();

        // Repite la recarga automáticamente según el tiempo configurado
        setInterval(recargarVista, tiempoRecarga);
    </script>

</body>
</html>
