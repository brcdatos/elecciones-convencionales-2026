<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados en Vivo - Conteo de Votos</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
        }
        
        #contenedor {
            position: relative;
            width: 100%;
            height: 100%;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            /* El iframe nuevo empieza invisible */
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        /* Cuando termina de cargar, se vuelve visible */
        iframe.listo {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="contenedor"></div>

    <script>
        const urlPublicada = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSrmKGhHQsoX9O9B71Pq3z87vmKWtOhHPTPlSF_IzZ_vpKOwRi-xFRQrzrj6cXmOy1fD90FUVkRE7m3/pubhtml?gid=674966579&single=true';
        const tiempoRecarga = 20000;

        function recargarVista() {
            const contenedor = document.getElementById('contenedor');
            const timestamp = new Date().getTime();
            const conector = urlPublicada.includes('?') ? '&' : '?';
            const urlConCacheBuster = urlPublicada + conector + 'nocache=' + timestamp;

            const nuevoIframe = document.createElement('iframe');

            // 1. PRIMERO escuchamos el evento de carga
            nuevoIframe.onload = function() {
                // Hacemos visible el nuevo iframe de forma suave
                setTimeout(function() {
                    nuevoIframe.classList.add('listo');
                    
                    // Eliminamos los iframes anteriores para mantener el sitio liviano
                    const MarcosViejos = contenedor.querySelectorAll('iframe:not(.listo)');
                    MarcosViejos.forEach(iframe => iframe.remove());
                }, 150);
            };

            // 2. Colocamos el iframe en la página
            contenedor.appendChild(nuevoIframe);

            // 3. ULTIMO: Asignamos la URL para iniciar la carga
            nuevoIframe.src = urlConCacheBuster;
        }

        recargarVista();
        setInterval(recargarVista, tiempoRecarga);
    </script>

</body>
</html>
